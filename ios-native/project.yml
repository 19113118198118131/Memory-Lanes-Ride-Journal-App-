# XcodeGen spec — generates MemoryLanes.xcodeproj from source.
#
# On a Mac:
#   brew install xcodegen
#   cd ios-native && xcodegen generate && open MemoryLanes.xcodeproj
#
# Hand-writing a .xcodeproj is error-prone; this YAML is the source of truth for
# the project so the repo stays diff-friendly and reproducible.

name: MemoryLanes
options:
  bundleIdPrefix: app.memorylanes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.26.0

targets:
  MemoryLanes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoryLanes
      - path: ../flow.html
        buildPhase: resources
      - path: ../flow.css
        buildPhase: resources
      - path: ../flow.js
        buildPhase: resources
      - path: ../style.css
        buildPhase: resources
      - path: ../icons.js
        buildPhase: resources
      - path: ../flow-engine.js
        buildPhase: resources
      - path: ../flow-storage.js
        buildPhase: resources
      - path: ../flow-audio.js
        buildPhase: resources
      - path: ../flow-renderer.js
        buildPhase: resources
      - path: ../flow-playcanvas-renderer.js
        buildPhase: resources
      - path: ../vendor/playcanvas/playcanvas.min.mjs
        buildPhase: resources
      - path: ../flow-assets.js
        buildPhase: resources
      - path: ../flow-effects.js
        buildPhase: resources
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_NAME: MemoryLanes
        INFOPLIST_FILE: MemoryLanes/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.memorylanes.native
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 57HZXXHCLS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: MemoryLanes/Resources/MemoryLanes.entitlements

  MemoryLanesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoryLanesTests
    dependencies:
      - target: MemoryLanes
    settings:
      base:
        PRODUCT_NAME: MemoryLanesTests
        PRODUCT_BUNDLE_IDENTIFIER: app.memorylanes.native.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MemoryLanes:
    build:
      targets:
        MemoryLanes: all
        MemoryLanesTests: [test]
    test:
      targets:
        - MemoryLanesTests
